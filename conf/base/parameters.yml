# ── Runtime (overridden at query time via CLI) ─────────────────────────────────
question: "What is the company PTO policy?"

# ── Chunking ──────────────────────────────────────────────────────────────────
chunk_size: 256          # tokens per chunk
chunk_overlap: 50        # token overlap between consecutive chunks
encoding_name: "cl100k_base"   # tiktoken encoding (matches gpt-4o-mini & embeddings)

# ── Retrieval ─────────────────────────────────────────────────────────────────
top_k: 20                 # number of chunks to retrieve before reranking

# ── Reranker ──────────────────────────────────────────────────────────────────
reranker_model: "qwen3.5:0.8b"   # reverted from 4b; 4b over-selects within documents
rerank_top_n: 7          # chunks kept after reranking

# ── Models ────────────────────────────────────────────────────────────────────
embedding_model: "nomic-embed-text"
llm_model: "qwen3.5:4b"
judge_model: "qwen3.5:4b"
ollama_base_url: "http://localhost:11434"

# ── ChromaDB ──────────────────────────────────────────────────────────────────
chroma_collection_name: "ctcobot_handbook"
chroma_persist_path: "data/04_feature/chroma_db"

# ── Corpus ────────────────────────────────────────────────────────────────────
raw_data_path: "data/01_raw/gitlab_handbook"
min_doc_tokens: 50       # documents shorter than this are filtered out

# ── Evaluation ────────────────────────────────────────────────────────────────
eval_num_latency_runs: 20        # total query runs for latency measurement
eval_latency_questions:          # fixed question set used for latency eval
  - "What is the expense reimbursement policy?"
  - "How do I report a security incident?"
  - "What is the policy on outside employment?"
  - "How many days of PTO are employees entitled to?"
  - "What are the data retention requirements?"

priority_folders:
  - "legal"
  - "people-group"
  - "total-rewards"
  - "people-policies"

# ── Agent (v3.0) ──────────────────────────────────────────────────────────────
agent_model: "qwen3.5:4b"       # model used for tool-calling routing decisions
lightrag_working_dir: "data/04_feature/lightrag_db"
bm25_top_k: 10                  # keyword chunks returned by KeywordRAGTool
lightrag_index_folders:         # only these handbook folders are graph-indexed
  - people-policies
  - people-group
  - hiring
  - total-rewards
  - legal