# ── Runtime (overridden at query time via CLI) ─────────────────────────────────
question: "What is the company PTO policy?"

# ── Chunking ──────────────────────────────────────────────────────────────────
chunk_size: 256          # tokens per chunk
chunk_overlap: 50        # token overlap between consecutive chunks
encoding_name: "cl100k_base"   # tiktoken encoding (matches gpt-4o-mini & embeddings)

# ── Retrieval ─────────────────────────────────────────────────────────────────
top_k: 10                 # reverted from 20 in v4.6 — folder filter keeps the
                          # pool clean; 20 added noise without quality gain

# ── Folder routing ────────────────────────────────────────────────────────────
top_folders: 7            # widened from 5 → 7 in v4.6 to give headroom against
                          # folder mis-routing (v4.5 missed people-group on 3 queries)
retrieve_oversample: 10   # multiplier on top_k for the pre-filter index search

# ── Reranker ──────────────────────────────────────────────────────────────────
reranker_model: "qwen3.5:0.8b"   # reverted from 4b; 4b over-selects within documents
rerank_top_n: 6          # 5 (v4.4) → 8 (v4.5 — too many, confused answer LLM)
                          # → 6 (v4.6 compromise). Final cut the answer LLM sees.
vector_rerank_top_n: 10  # GEN.5: vector tool keeps ALL retrieved candidates (≥ top_k)
                          # so the weak 0.8b reranker no longer pre-drops the
                          # answer-bearing section; the 4b agent reranker owns the
                          # final cut to rerank_top_n over the full set.

# ── Agentic routing (v5.0) ────────────────────────────────────────────────────
agent_model: "qwen3.5:4b"   # tool-calling router that picks vector_rag / keyword_rag
bm25_top_k: 10              # BM25 candidates returned before merge + rerank
agent_reranker_model: "qwen3.5:4b"   # stronger reranker for the merged set (v5.2);
                                     # the merged union concentrates cross-folder
                                     # BM25 noise, so it gets 4b not 0.8b

# ── Retrieval evaluation (v5.2) ───────────────────────────────────────────────
retrieval_eval_k: 10        # fixed top-k window for hit/MRR/precision/recall

# ── Models ────────────────────────────────────────────────────────────────────
embedding_model: "nomic-embed-text"
llm_model: "qwen3.5:4b"
judge_model: "qwen3.5:4b"
# GEN.6: judge each answer judge_votes times at judge_temperature and take the
# MEDIAN score. Multi-vote at moderate temp shrinks the run-to-run judge swing
# (e.g. the remote-work 1→2→5) that a single greedy temp-0 verdict produced.
judge_votes: 3
judge_temperature: 0.4
ollama_base_url: "http://localhost:11434"

# ── TurboVec index ────────────────────────────────────────────────────────────
turbovec_persist_path: "data/04_feature/turbovec_db"

# ── Entity-page de-prioritization (GEN.3) ─────────────────────────────────────
# Retrieval-time penalty on location/entity-specific leaf pages so canonical
# company-wide policy pages surface on general questions. Generic by default
# (empty list = no-op); set per-corpus. `_index.md` pages are never penalized.
deprioritize_path_patterns:
  - "general-and-entity-benefits/"
  - "leave-of-absence/"
  - "france-sas/"   # GEN.7: France entity charter — never a keyed answer, but
                    # pollutes remote-work & working-hours. (ireland-ltd is NOT
                    # listed: it IS the keyed answer for right-to-disconnect.)
entity_penalty_factor: 0.5   # GEN.7: 0.85→0.5. Decisive demotion so location/
                             # entity leaf pages stop reaching the final answer
                             # context on general questions.

# ── Corpus ────────────────────────────────────────────────────────────────────
raw_data_path: "data/01_raw/gitlab_handbook"
min_doc_tokens: 50       # documents shorter than this are filtered out

# ── Evaluation ────────────────────────────────────────────────────────────────
# Latency is derived from per-question timings in run_eval_pipeline; no
# separate latency loop is run.

# Trimmed in GEN.4: dropped "people-policies" — force-injecting it dragged
# country/entity leaf pages (leave-of-absence/us.md, france-sas, ireland-ltd)
# into general questions. The router now adds people-policies only when relevant
# (working hours / right to disconnect); see FOLDER_RANK_SYSTEM_PROMPT.
priority_folders:
  - "people-group"
  - "total-rewards"
  - "legal"

# ── LightRAG ──────────────────────────────────────────────────────────────────
lightrag_working_dir: "data/04_feature/lightrag_db"
lightrag_index_folders:         # only these handbook folders are graph-indexed
  - people-policies
  - people-group
  - hiring
  - legal
  - company