# ── Runtime (overridden at query time via CLI) ─────────────────────────────────
question: "What is the company PTO policy?"

# ── Models ────────────────────────────────────────────────────────────────────
llm_model: "qwen3.5:4b"
judge_model: "qwen3.5:4b"
ollama_base_url: "http://localhost:11434"

# ── PageIndex ─────────────────────────────────────────────────────────────────
pageindex_model: "qwen3.5:4b"                              # Ollama model for tree indexing + retrieval
pageindex_workspace: "data/04_feature/pageindex_workspace" # cached tree structures on disk
pageindex_top_docs: 8              # docs selected in coarse retrieval stage
pageindex_top_sections: 8          # sections fetched per selected document
pageindex_reranker_top_k: 10       # chunks kept after stage-3 reranking

# ── Corpus ────────────────────────────────────────────────────────────────────
raw_data_path: "data/01_raw/gitlab_handbook"
min_doc_tokens: 50       # documents shorter than this are filtered during ingestion

# ── Evaluation ────────────────────────────────────────────────────────────────
eval_num_latency_runs: 20        # total query runs for latency measurement
eval_latency_questions:          # fixed question set used for latency eval
  - "What is the expense reimbursement policy?"
  - "How do I report a security incident?"
  - "What is the policy on outside employment?"
  - "How many days of PTO are employees entitled to?"
  - "What are the data retention requirements?"

priority_folders:
  - "legal"
  - "people-group"
  - "total-rewards"
  - "people-policies"
