# ── Runtime (overridden at query time via CLI) ─────────────────────────────────
question: "What is the company PTO policy?"   # default question for the ad-hoc query pipeline

# ── Benchmark versioning ───────────────────────────────────────────────────────
# Single source of truth for the version label. Change it once per run; it drives
# the report's benchmark_version field, the output filename
# (data/08_reporting/benchmark_report_v<version>.json, dots → dashes) and the
# console banner.
benchmark_version: "FINAL2"

# ── Chunking ──────────────────────────────────────────────────────────────────
chunk_size: 256                # tokens per chunk
chunk_overlap: 50              # token overlap between consecutive chunks
encoding_name: "cl100k_base"   # tiktoken encoding used to count tokens when chunking

# ── Retrieval ─────────────────────────────────────────────────────────────────
top_k: 10                 # vector chunks the vector tool returns per query (before rerank)

# ── Folder routing ────────────────────────────────────────────────────────────
top_folders: 5            # number of LLM-ranked folders retrieval is restricted to
retrieve_oversample: 10   # index pre-search multiplier: fetch top_k × this, then folder-filter back to top_k

# ── Reranker ──────────────────────────────────────────────────────────────────
reranker_model: "qwen3.5:4b"   # model that reranks each tool's own results
rerank_top_n: 6                  # chunks kept after rerank — the final answer-LLM context

# ── Agentic routing ───────────────────────────────────────────────────────────
agent_model: "qwen3.5:4b"            # tool-calling router that picks vector_rag / keyword_rag
bm25_top_k: 10                       # keyword (BM25) candidates returned before merge + rerank
agent_reranker_model: "qwen3.5:4b"   # model that reranks the merged vector + keyword set

# ── Retrieval evaluation ──────────────────────────────────────────────────────
retrieval_eval_k: 10      # fixed top-k window the retrieval metrics (hit/MRR/precision/recall) score over

# ── Models ────────────────────────────────────────────────────────────────────
embedding_model: "nomic-embed-text"        # Ollama model that embeds chunks and queries
llm_model: "qwen3.5:4b"                    # Ollama model that writes the final answer
judge_model: "qwen3.5:4b"                  # Ollama model that scores answer quality in evaluation
ollama_base_url: "http://localhost:11434"  # Ollama server URL

# ── TurboVec index ────────────────────────────────────────────────────────────
turbovec_persist_path: "data/04_feature/turbovec_db"   # directory holding index.tq + meta.json

# ── Corpus ────────────────────────────────────────────────────────────────────
raw_data_path: "data/01_raw/gitlab_handbook"   # root of the Markdown corpus to ingest
min_doc_tokens: 50                             # drop documents shorter than this many tokens

# ── Evaluation: acceptance criteria ───────────────────────────────────────────
# Pass/fail thresholds for the benchmark report; retrieval/quality metrics are
# lower bounds (≥) and p95 latency is an upper bound (≤). They set the report's
# `targets` block and every `*_pass` flag.
benchmark_targets:
  hit_rate_at_k: 0.70        # min fraction of questions whose correct doc is in the top-k
  mrr: 0.55                  # min mean reciprocal rank of the correct doc
  precision_at_k: 0.15       # min average precision over the top-k window
  recall_at_k: 0.35          # min average recall over the top-k window
  avg_quality_score: 3.5     # min mean LLM-judge answer score (1–5)
  p95_latency_seconds: 120.0   # max p95 end-to-end latency per question (seconds)

# Folders ALWAYS unioned into the retrieval filter (a safety floor so HR/policy
# folders survive router variance); leave empty for no floor.
priority_folders:
  - "legal"
  - "people-group"
  - "total-rewards"
  - "people-policies"

# ── LightRAG (knowledge-graph index + graph_rag agent tool) ───────────────────
# Build the graph store with `ctcobot index_graph` (slow: LLM entity/relation
# extraction over every indexed doc — budget machine time accordingly). The
# agent registers the graph_rag tool only when `enabled` is true AND a built
# store exists under working_dir; otherwise it degrades gracefully to the
# vector + keyword tools.
lightrag:
  enabled: true
  working_dir: "data/04_feature/lightrag_db"   # graph store location
  index_folders:              # only these top-level folders are graph-indexed
    - people-policies
    - people-group
    - hiring
    - legal
    - company
  llm_model: "qwen3.5:4b"               # entity/relation extraction + query keyword extraction
  embedding_model: "nomic-embed-text"   # must stay consistent between index and query
  embedding_dim: 768                    # output size of embedding_model
  num_ctx: 8192                         # context window for extraction/query LLM calls
  query_mode: "hybrid"                  # local | global | hybrid | mix | naive
  top_k: 20                             # entities/relations retrieved per query
  chunk_top_k: 5                        # document chunks the graph tool returns
  max_parallel_insert: 2                # concurrent docs during the graph build
  insert_batch_size: 20                 # docs per insert batch during the build
